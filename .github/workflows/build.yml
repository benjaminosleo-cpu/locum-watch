name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # A release (or tag) build is named after its tag; other builds are 0.0.<run>.
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${TAG:-0.0.${{ github.run_number }}}"
          gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "locum-watch-${TAG:-build-${{ github.run_number }}}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: locum-watch-apk
          path: locum-watch-*.apk

      - name: Attach APK to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: locum-watch-*.apk
