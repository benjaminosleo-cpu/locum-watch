name: build

# Every push to main: run the tests (including a replay of the whole group history),
# build the signed APK and, if all passes, publish it as a GitHub Release
# v<VERSION>.<run number>. Obtainium follows these releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Work out the version
        run: echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "locum-watch-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: locum-watch-apk
          path: locum-watch-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Locum Watch v${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          files: locum-watch-*.apk
